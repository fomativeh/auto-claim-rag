[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auto-claim-rag"
version = "0.1.0"
description = "Domain-specific auto-insurance claim document extraction with RAG + structured output"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "requests>=2.32",
  "scikit-learn>=1.4",
  "sentence-transformers>=3.0.1",
  "tqdm>=4.66",
  "pypdf>=4.2",
  "openai>=1.35.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
